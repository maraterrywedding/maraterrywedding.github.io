name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Node 24 runs TypeScript directly, which the mock RSVP backend relies
          # on — it imports the real Apps Script handlers rather than restating
          # them, so the end-to-end tests exercise production logic.
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx astro check

      - name: Unit tests
        run: npm run test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end and accessibility tests
        # playwright.config.ts starts the dev server and the mock backend itself.
        env:
          PUBLIC_RSVP_ENDPOINT: http://localhost:8788
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
